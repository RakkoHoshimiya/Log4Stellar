name: Log4Stellar Web

# The Web package (apps/web) is a Node server, not part of the VS Code desktop build, so
# it does not belong in pr.yml: that workflow fans out to the upstream Electron, Browser,
# Windows and macOS jobs, which either fail to build the Web server or, worse, succeed
# without ever running its tests. This file is the single explicit entry for the Web
# package; the upstream workflows keep running unchanged for the editor.
#
# The jobs are deliberately separate rather than one job with `if:` steps:
#   - Static and Unit need no services, so they report in about a minute and a broken
#     commit is visible before the slow jobs start.
#   - Integration needs a real PostgreSQL and an S3-compatible store, because the storage
#     layer is SQL plus objects. It starts its own services and never talks to the
#     deployment host (see apps/web/ci-workflow.mjs, which rejects any marker of it).
#   - Browser needs Playwright and a Chromium download; keeping it apart means a flaky
#     browser run does not hide a unit failure.

on:
  pull_request:
  push:
    branches:
      - 'publish/log4stellar-web-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REPORT_DIR: web-ci-reports
  # Every job installs the node the Web server actually runs on. The release marker pins
  # a major and readWebRelease() refuses a package built on another one, so this must be
  # the same `.nvmrc` the deployment uses.
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  static:
    name: Web / Static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir apps/web --ignore-workspace install --frozen-lockfile --ignore-scripts

      - name: Verify syntax, workflow and resources
        run: |
          mkdir -p "$REPORT_DIR"
          (
            for file in apps/web/*.mjs apps/web/*.js; do
              node --check "$file" || exit
            done
            node apps/web/verify-ci-flow.mjs --static &&
              node apps/web/verify-ci-flow.mjs --inventory &&
              node apps/web/verify-ci-flow.mjs --resources
          ) 2>&1 | tee "$REPORT_DIR/static.log"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-static-attempt-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          retention-days: 14
          if-no-files-found: warn

  unit:
    name: Web / Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir apps/web --ignore-workspace install --frozen-lockfile --ignore-scripts

      - name: Run the Web unit tests
        run: |
          mkdir -p "$REPORT_DIR"
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$REPORT_DIR/unit.tap" \
            apps/web/*.test.mjs 2>&1 | tee "$REPORT_DIR/unit.log"

      - name: Require every skip to carry a reason
        run: node apps/web/verify-ci-flow.mjs --tap "$REPORT_DIR/unit.tap"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-unit-attempt-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          retention-days: 14
          if-no-files-found: warn

  integration:
    name: Web / Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The storage layer is PostgreSQL plus an S3-compatible object store, so an in-process
    # fake would test the fake. The service credentials below are local to this job and
    # have nothing in common with the deployment.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: log4stellar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs@sha256:0dff1515b3c52b5ce8c5df2263420c7f93ae1c5d07cca79e19e57cff86b84c85
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin
          RUSTFS_CONSOLE_ENABLE: 'false'
        ports:
          - 127.0.0.1:9000:9000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir apps/web --ignore-workspace install --frozen-lockfile --ignore-scripts

      - name: Install LibreOffice for the conversion suite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress

      - name: Prepare the isolated storage configuration
        run: |
          config=$(node apps/web/verify-ci-flow.mjs --isolated-storage | sed -n 's/^export LOG4STELLAR_STORAGE_CONFIG=//p')
          test -f "$config"
          printf 'LOG4STELLAR_STORAGE_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"

      - name: Initialize isolated database and object storage
        working-directory: apps/web
        run: |
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:9000/health
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { Pool } from 'pg';
          import { S3Client, CreateBucketCommand } from '@aws-sdk/client-s3';
          const { postgres, s3 } = JSON.parse(await readFile(process.env.LOG4STELLAR_STORAGE_CONFIG, 'utf8'));
          const pool = new Pool(postgres);
          try {
            await pool.query('CREATE SCHEMA IF NOT EXISTS log4stellar');
          } finally {
            await pool.end();
          }
          const client = new S3Client({ endpoint: s3.endpoint, region: s3.region, forcePathStyle: true, credentials: s3 });
          try {
            await client.send(new CreateBucketCommand({ Bucket: s3.bucket }));
          } finally {
            client.destroy();
          }
          JS

      # The integration fixtures share a database with a limited connection budget.
      - name: Run the Web integration tests
        run: |
          mkdir -p "$REPORT_DIR"
          LOG4STELLAR_IT=1 node --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$REPORT_DIR/integration.tap" \
            apps/web/*.test.mjs 2>&1 | tee "$REPORT_DIR/integration.log"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-integration-attempt-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          retention-days: 14
          if-no-files-found: warn

  browser:
    name: Web / Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir apps/web --ignore-workspace install --frozen-lockfile --ignore-scripts

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the browser tests
        run: |
          mkdir -p "$REPORT_DIR"
          LOG4STELLAR_BROWSER_IT=1 node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$REPORT_DIR/browser.tap" \
            apps/web/*.browser.test.mjs 2>&1 | tee "$REPORT_DIR/browser.log"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-browser-attempt-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          retention-days: 14
          if-no-files-found: warn

  # A single check the branch protection rule can require. Without it a job that is
  # skipped, cancelled or never created reports as "not required" instead of as failed.
  gate:
    name: Web / Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [static, unit, integration, browser]
    if: always()
    steps:
      - name: Report the job results
        run: |
          echo "static=${{ needs.static.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "browser=${{ needs.browser.result }}"
          for result in "${{ needs.static.result }}" "${{ needs.unit.result }}" "${{ needs.integration.result }}" "${{ needs.browser.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::The Web pipeline is blocked: a required job finished as $result."
              exit 1
            fi
          done
